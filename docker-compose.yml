services:
  virtuoso:
    image: openlink/virtuoso-opensource-7:latest
    container_name: cskg-sparql
    environment:
      DBA_PASSWORD: dba
      SPARQL_UPDATE: 'true'
    ports:
      - '8890:8890' # SPARQL Endpoint HTTP / Conductor Web UI
      - '1111:1111' # ISQL connection port
    volumes:
      - ./sparql/db:/database
      - ./sparql/data:/opt/virtuoso-opensource/vsp/toload
    restart: unless-stopped

  pipeline:
    build: .
    container_name: cskg-pipeline
    environment:
      - VIRTUOSO_HOST=virtuoso
      - VIRTUOSO_CONTAINER=cskg-sparql
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    depends_on:
      - virtuoso

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cskg-web
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SPARQL_ENDPOINT=http://virtuoso:8890/sparql
    depends_on:
      - virtuoso
